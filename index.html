<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1635">
<meta name="description" content="A modern candy-blue and candy-pink birthday scrapbook for Sneha.">
<title>For Sneha — Happy Birthday ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div id="ambient" class="ambient" aria-hidden="true"></div>
<button id="musicToggle" class="music-toggle" type="button" aria-label="Play background music" title="Play / pause music">🔇</button>
<audio id="bgMusic" preload="auto" loop src="assets/audio/birthday-piano.mp3"></audio>

<main class="stage">
  <div class="book-shell">
    <div class="book-glow"></div>
    <div class="book" id="book" aria-live="polite">
      <div class="page-layer" id="pageLayer"></div>
      <div class="paper-grain"></div>
      <div class="spine-shadow" aria-hidden="true"></div>
    </div>
    <div class="nav-row">
      <button id="prevBtn" class="nav-btn" type="button" aria-label="Previous page">←</button>
      <div class="page-counter"><span id="pageCounter">1 / 7</span><i></i></div>
      <button id="nextBtn" class="nav-btn" type="button" aria-label="Next page">→</button>
    </div>
    <div class="swipe-hint">swipe • drag • tap • turn the candy pages</div>
  </div>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
